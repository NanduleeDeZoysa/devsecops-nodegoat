name: Vault Secret Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  vault-test:
    name: Retrieve secret from HashiCorp Vault
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Retrieve secret from Vault
        id: vault
        uses: hashicorp/vault-action@v3
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: nodegoat-github
          secrets: |
            secret/data/nodegoat NODEGOAT_DEMO_SECRET | NODEGOAT_DEMO_SECRET

      - name: Verify Vault secret was injected
        env:
          NODEGOAT_DEMO_SECRET: ${{ steps.vault.outputs.NODEGOAT_DEMO_SECRET }}
        run: |
          test -n "$NODEGOAT_DEMO_SECRET"
          echo "Vault secret retrieved successfully."
          echo "Secret value is not displayed."
